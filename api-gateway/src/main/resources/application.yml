server:
  port: 8001

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/auth/**

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/users/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://service-registry:8761/eureka

jwt:
  secret: ${JWT_SECRET}
  exp:
    time: ${JWT_EXP_TIME}
  issuer: ${JWT_ISSUER}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
