networks:
  app-network:
    driver: bridge

services:

  rabbitmq:
    container_name: 'rabbit-mq'
    image: rabbitmq:management
    environment:
      - 'RABBITMQ_DEFAULT_PASS=secret'
      - 'RABBITMQ_DEFAULT_USER=myuser'
      -  'RABBITMQ_PLUGINS_ENABLE=rabbitmq_stomp,rabbitmq_web_stomp'
    ports:
      - '5672:5672'
      - '15672:15672'
      - '61613:61613'
      - '15674:15674'

